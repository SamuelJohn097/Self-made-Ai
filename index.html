<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gemini Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0a0a0f;
    --surface:   rgba(255,255,255,0.04);
    --border:    rgba(255,255,255,0.08);
    --border-hi: rgba(255,255,255,0.16);
    --accent:    #4f8eff;
    --accent2:   #a78bfa;
    --text:      #e8e8f0;
    --muted:     #666680;
    --user-bg:   linear-gradient(135deg, #4f8eff22, #a78bfa22);
    --ai-bg:     rgba(255,255,255,0.03);
    --glow:      0 0 40px rgba(79,142,255,0.15);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    overflow: hidden;
  }

  /* animated background mesh */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 60% 50% at 20% 10%, rgba(79,142,255,0.12) 0%, transparent 70%),
      radial-gradient(ellipse 50% 60% at 80% 90%, rgba(167,139,250,0.10) 0%, transparent 70%),
      radial-gradient(ellipse 40% 40% at 60% 40%, rgba(79,142,255,0.05) 0%, transparent 70%);
    pointer-events: none;
  }

  #app {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    height: 100vh; max-width: 820px;
    margin: 0 auto; padding: 0 16px;
  }

  /* ── Header ── */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 20px 0 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    animation: fadeDown 0.5s ease both;
  }

  .logo {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
    box-shadow: 0 0 20px rgba(79,142,255,0.4);
  }

  header h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800; font-size: 1.25rem;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, #fff 40%, var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }

  .model-badge {
    margin-left: auto;
    font-size: 0.7rem; font-weight: 500; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 20px; padding: 4px 10px;
  }

  /* ── System prompt bar ── */
  #system-bar {
    padding: 10px 0 8px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    animation: fadeDown 0.5s 0.1s ease both;
    opacity: 0;
  }

  #system-bar label {
    font-size: 0.7rem; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--muted);
    display: block; margin-bottom: 6px;
  }

  #system-input {
    width: 100%; background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 0.82rem;
    resize: none; outline: none; line-height: 1.4;
    transition: border-color 0.2s;
  }
  #system-input:focus { border-color: var(--border-hi); }

  /* ── Messages ── */
  #messages {
    flex: 1; overflow-y: auto;
    padding: 20px 0; display: flex; flex-direction: column; gap: 16px;
    scroll-behavior: smooth;
  }

  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 2px; }

  .msg {
    display: flex; gap: 12px; align-items: flex-start;
    animation: fadeUp 0.3s ease both;
  }

  .msg.user { flex-direction: row-reverse; }

  .avatar {
    width: 32px; height: 32px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0; font-weight: 600;
  }

  .msg.user .avatar {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 0 12px rgba(79,142,255,0.3);
  }

  .msg.ai .avatar {
    background: var(--surface);
    border: 1px solid var(--border);
  }

  .bubble {
    max-width: 78%; padding: 12px 16px;
    border-radius: 14px; line-height: 1.65;
    font-size: 0.92rem; font-weight: 300;
  }

  .msg.user .bubble {
    background: var(--user-bg);
    border: 1px solid rgba(79,142,255,0.25);
    border-bottom-right-radius: 4px;
  }

  .msg.ai .bubble {
    background: var(--ai-bg);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  /* typing dots */
  .typing { display: flex; gap: 5px; align-items: center; padding: 4px 0; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted); display: inline-block;
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  /* empty state */
  #empty {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    text-align: center; padding: 40px 20px;
    animation: fadeUp 0.6s 0.2s ease both; opacity: 0;
  }

  #empty .big-logo {
    width: 64px; height: 64px; border-radius: 18px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
    box-shadow: 0 0 40px rgba(79,142,255,0.3), 0 0 80px rgba(167,139,250,0.15);
  }

  #empty h2 {
    font-family: 'Syne', sans-serif; font-weight: 700;
    font-size: 1.4rem; letter-spacing: -0.02em;
    background: linear-gradient(90deg, #fff, var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }

  #empty p { color: var(--muted); font-size: 0.88rem; max-width: 320px; line-height: 1.6; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }

  .chip {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 7px 14px;
    font-size: 0.8rem; color: var(--text); cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .chip:hover { border-color: var(--accent); background: rgba(79,142,255,0.08); }

  /* ── Input area ── */
  #input-area {
    padding: 12px 0 20px; flex-shrink: 0;
    animation: fadeUp 0.5s 0.15s ease both; opacity: 0;
  }

  #input-row {
    display: flex; gap: 10px; align-items: flex-end;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px; padding: 10px 10px 10px 16px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  #input-row:focus-within {
    border-color: var(--border-hi);
    box-shadow: var(--glow);
  }

  #user-input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text); font-family: 'DM Sans', sans-serif;
    font-size: 0.94rem; font-weight: 300; resize: none;
    line-height: 1.5; max-height: 160px; overflow-y: auto;
  }

  #user-input::placeholder { color: var(--muted); }

  #send-btn {
    width: 38px; height: 38px; border-radius: 10px; border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 0.2s, transform 0.15s;
    box-shadow: 0 0 16px rgba(79,142,255,0.4);
  }
  #send-btn:hover { transform: scale(1.05); }
  #send-btn:active { transform: scale(0.96); }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .footer-hint {
    text-align: center; color: var(--muted);
    font-size: 0.7rem; margin-top: 8px;
  }

  /* ── Error toast ── */
  #error-toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #ff4466; color: #fff; border-radius: 10px;
    padding: 10px 18px; font-size: 0.82rem; font-weight: 500;
    opacity: 0; pointer-events: none; transition: all 0.3s; z-index: 99;
    max-width: 340px; text-align: center;
  }
  #error-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── Animations ── */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40%            { transform: translateY(-6px); opacity: 1; }
  }
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="logo">✦</div>
    <h1>Gemini Chat</h1>
    <span class="model-badge">gemini-2.0-flash</span>
  </header>

  <div id="system-bar">
    <label>System Prompt (optional)</label>
    <textarea id="system-input" rows="1"
      placeholder="Give your AI a personality, role, or instructions…">You are a helpful, friendly AI assistant.</textarea>
  </div>

  <div id="messages">
    <div id="empty">
      <div class="big-logo">✦</div>
      <h2>What can I help with?</h2>
      <p>Ask anything — code, ideas, explanations, creative writing, or just a chat.</p>
      <div class="chips">
        <span class="chip" onclick="sendChip(this)">Explain quantum computing</span>
        <span class="chip" onclick="sendChip(this)">Write a short story</span>
        <span class="chip" onclick="sendChip(this)">Help me debug my code</span>
        <span class="chip" onclick="sendChip(this)">Give me a fun fact</span>
      </div>
    </div>
  </div>

  <div id="input-area">
    <div id="input-row">
      <textarea id="user-input" rows="1"
        placeholder="Message Gemini…"></textarea>
      <button id="send-btn" onclick="sendMessage()" title="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
    <p class="footer-hint">Powered by Google Gemini · Enter to send · Shift+Enter for new line</p>
  </div>

</div>

<div id="error-toast"></div>

<script>
  const API_KEY = "AIzaSyBH79Xa6TUBVwx_GzYJHTnEsS0qHP4b2Iw";
  const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`;

  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('user-input');
  const sendBtn    = document.getElementById('send-btn');
  const emptyEl    = document.getElementById('empty');
  const systemEl  = document.getElementById('system-input');

  let history = [];   // { role, text }
  let thinking = false;

  // auto-resize textarea
  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 160) + 'px';
  }
  inputEl.addEventListener('input', () => autoResize(inputEl));

  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function sendChip(el) {
    inputEl.value = el.textContent;
    sendMessage();
  }

  function appendMsg(role, text) {
    if (emptyEl) emptyEl.style.display = 'none';

    const wrap = document.createElement('div');
    wrap.className = `msg ${role}`;
    wrap.innerHTML = `
      <div class="avatar">${role === 'user' ? '👤' : '✦'}</div>
      <div class="bubble">${escapeHtml(text)}</div>
    `;
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return wrap;
  }

  function appendTyping() {
    if (emptyEl) emptyEl.style.display = 'none';
    const wrap = document.createElement('div');
    wrap.className = 'msg ai';
    wrap.id = 'typing-indicator';
    wrap.innerHTML = `
      <div class="avatar">✦</div>
      <div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>
    `;
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return wrap;
  }

  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/\n/g, '<br>');
  }

  function showError(msg) {
    const toast = document.getElementById('error-toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 4000);
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || thinking) return;

    thinking = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    autoResize(inputEl);

    appendMsg('user', text);
    history.push({ role: 'user', text });

    const typingEl = appendTyping();

    try {
      // build Gemini contents array from history
      const contents = history.map(m => ({
        role: m.role === 'user' ? 'user' : 'model',
        parts: [{ text: m.text }]
      }));

      const systemPrompt = systemEl.value.trim();
      const body = { contents };
      if (systemPrompt) {
        body.systemInstruction = { parts: [{ text: systemPrompt }] };
      }

      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      const data = await res.json();

      typingEl.remove();

      if (data.error) {
        showError(`API error: ${data.error.message}`);
        history.pop();
      } else {
        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || '(no response)';
        appendMsg('ai', reply);
        history.push({ role: 'model', text: reply });
      }

    } catch (err) {
      typingEl.remove();
      showError('Network error — check your connection.');
      history.pop();
      console.error(err);
    }

    thinking = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
</script>
</body>
</html>
