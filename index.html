<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- Anti-flash: set saved theme before first paint -->
<script>
  (function() {
    try {
      if (localStorage.getItem('samuels-ai-theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) {}
  })();
</script>
<title>Samuel's AI</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after {
    box-sizing: border-box; margin: 0; padding: 0;
    transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
  }

  /* Theme tokens — LIGHT is the default (:root), dark overrides via [data-theme="dark"] */
  :root {
    --bg: #f7f7fb;
    --surface: rgba(20,20,30,0.035);
    --border: rgba(20,20,30,0.10);
    --border-hi: rgba(20,20,30,0.18);
    --text: #15151f;
    --muted: #6f6f82;
    --icon-color: #15151f;
    --icon-glow: rgba(20,20,30,0.18);
    --success-color: #0e9d63;
  }

  [data-theme="dark"] {
    --bg: #07070d;
    --surface: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.08);
    --border-hi: rgba(255,255,255,0.16);
    --text: #e8e8f0;
    --muted: #55556a;
    --icon-color: #ffffff;
    --icon-glow: rgba(255,255,255,0.5);
    --success-color: #3cffa0;
  }

  html, body { height:100%; background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; overflow:hidden; }

  body::before {
    content:''; position:fixed; inset:0; z-index:0;
    background:
      radial-gradient(ellipse 55% 45% at 15% 10%, rgba(255,60,120,0.10) 0%, transparent 65%),
      radial-gradient(ellipse 50% 55% at 85% 85%, rgba(60,120,255,0.10) 0%, transparent 65%),
      radial-gradient(ellipse 40% 40% at 50% 50%, rgba(60,255,160,0.06) 0%, transparent 65%);
    animation: bgShift 8s ease-in-out infinite alternate;
    pointer-events:none;
  }

  @keyframes bgShift { 0% { filter:hue-rotate(0deg); } 100% { filter:hue-rotate(360deg); } }
  @keyframes rgbLogo {
    0%   { background-position:0% 50%;   box-shadow:0 0 20px rgba(255,60,120,0.5); }
    33%  { background-position:100% 50%; box-shadow:0 0 20px rgba(79,142,255,0.5); }
    66%  { background-position:50% 0%;   box-shadow:0 0 20px rgba(60,255,160,0.5); }
    100% { background-position:0% 50%;   box-shadow:0 0 20px rgba(255,60,120,0.5); }
  }
  @keyframes rgbText { 0% { background-position:0% 50%; } 100% { background-position:300% 50%; } }
  @keyframes fadeDown { from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:translateY(0)} }
  @keyframes fadeUp   { from{opacity:0;transform:translateY(12px)}  to{opacity:1;transform:translateY(0)} }
  @keyframes bounce   { 0%,80%,100%{transform:translateY(0);opacity:0.4} 40%{transform:translateY(-6px);opacity:1} }

  #app { position:relative; z-index:1; display:flex; flex-direction:column; height:100vh; max-width:820px; margin:0 auto; padding:0 16px; }

  header { display:flex; align-items:center; gap:12px; padding:18px 0 14px; border-bottom:1px solid var(--border); flex-shrink:0; animation:fadeDown 0.5s ease both; }

  .logo {
    width:38px; height:38px; display:flex; align-items:center; justify-content:center;
    font-size:28px; flex-shrink:0; color:var(--icon-color); background:none;
    filter:drop-shadow(0 0 8px var(--icon-glow));
  }

  .title-wrap { display:flex; align-items:baseline; gap:8px; }
  .title-cursive {
    font-family:'Dancing Script', cursive; font-size:1.6rem;
    background:linear-gradient(90deg,#ff3c78,#4f8eff,#3cffa0,#ff3c78);
    background-size:300% 100%;
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    animation:rgbText 4s linear infinite;
  }
  .title-bold { font-family:'Syne',sans-serif; font-weight:800; font-size:1.3rem; color:var(--text); letter-spacing:-0.02em; }
  .model-badge { margin-left:auto; font-size:0.68rem; font-weight:500; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); border:1px solid var(--border); border-radius:20px; padding:4px 10px; }

  /* Theme toggle button */
  .theme-toggle-btn {
    width:32px; height:32px; border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    background:var(--surface); border:1px solid var(--border);
    color:var(--text); cursor:pointer; flex-shrink:0;
    margin-left:10px;
    transition: background-color 0.3s ease, border-color 0.3s ease, transform 0.15s ease, color 0.3s ease;
  }
  .theme-toggle-btn:hover { border-color:var(--border-hi); transform:scale(1.06); }
  .theme-toggle-btn:active { transform:scale(0.94); }
  .theme-toggle-btn:focus-visible { outline:2px solid #4f8eff; outline-offset:2px; }
  .theme-toggle-btn svg { width:16px; height:16px; }
  .icon-sun { display:none; }
  .icon-moon { display:block; }
  [data-theme="dark"] .icon-sun { display:block; }
  [data-theme="dark"] .icon-moon { display:none; }

  .rgb-line { height:1px; width:100%; background:linear-gradient(90deg,#ff3c78,#4f8eff,#3cffa0,#ff3c78); background-size:300% 100%; animation:rgbText 4s linear infinite; flex-shrink:0; }

  #system-bar { padding:10px 0 8px; border-bottom:1px solid var(--border); flex-shrink:0; }
  #system-bar label { font-size:0.68rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); display:block; margin-bottom:6px; }
  #system-input { width:100%; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 12px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:0.82rem; resize:none; outline:none; line-height:1.4; transition:background-color 0.3s ease, color 0.3s ease, border-color 0.2s; }
  #system-input:focus { border-color:var(--border-hi); }

  #messages { flex:1; overflow-y:auto; padding:20px 0; display:flex; flex-direction:column; gap:16px; scroll-behavior:smooth; }
  #messages::-webkit-scrollbar { width:4px; }
  #messages::-webkit-scrollbar-track { background:transparent; }
  #messages::-webkit-scrollbar-thumb { background:var(--border-hi); border-radius:2px; }

  .msg { display:flex; gap:12px; align-items:flex-start; animation:fadeUp 0.3s ease both; }
  .msg.user { flex-direction:row-reverse; }
  .avatar { width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
  .msg.user .avatar { background:linear-gradient(135deg,#ff3c78,#4f8eff); box-shadow:0 0 12px rgba(255,60,120,0.3); }
  .msg.ai .avatar { background:none; border:none; color:var(--icon-color); font-size:20px; filter:drop-shadow(0 0 4px var(--icon-glow)); }

  .bubble-stack { display:flex; flex-direction:column; gap:4px; max-width:78%; }
  .msg.user .bubble-stack { align-items:flex-end; }
  .msg.ai .bubble-stack { align-items:flex-start; }

  .bubble { padding:12px 16px; border-radius:14px; line-height:1.65; font-size:0.92rem; font-weight:300; }
  .msg.user .bubble { background:rgba(255,60,120,0.10); border:1px solid rgba(255,60,120,0.2); border-bottom-right-radius:4px; }
  .msg.ai .bubble { background:var(--surface); border:1px solid var(--border); border-bottom-left-radius:4px; }

  .copy-btn { display:flex; align-items:center; gap:5px; background:none; border:none; color:var(--muted); font-family:'DM Sans',sans-serif; font-size:0.72rem; cursor:pointer; padding:2px 6px; transition:color 0.2s; }
  .copy-btn:hover { color:var(--text); }
  .copy-btn.copied { color:var(--success-color); }
  .copy-btn svg { flex-shrink:0; }

  .typing { display:flex; gap:5px; align-items:center; padding:4px 0; }
  .typing span { width:6px; height:6px; border-radius:50%; background:var(--muted); display:inline-block; animation:bounce 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay:0.2s; }
  .typing span:nth-child(3) { animation-delay:0.4s; }

  #empty { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; padding:40px 20px; animation:fadeUp 0.6s 0.2s ease both; opacity:0; }
  #empty .big-logo { width:68px; height:68px; display:flex; align-items:center; justify-content:center; font-size:60px; color:var(--icon-color); background:none; filter:drop-shadow(0 0 16px var(--icon-glow)); }
  #empty h2 { font-family:'Syne',sans-serif; font-weight:700; font-size:1.4rem; color:var(--text); }
  #empty p { color:var(--muted); font-size:0.88rem; max-width:300px; line-height:1.6; }

  .chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:8px; }
  .chip { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:7px 14px; font-size:0.8rem; color:var(--text); cursor:pointer; transition:all 0.2s; }
  .chip:hover { border-color:rgba(255,60,120,0.5); background:rgba(255,60,120,0.08); }

  #input-area { padding:12px 0 20px; flex-shrink:0; }
  #input-row { display:flex; gap:10px; align-items:flex-end; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:10px 10px 10px 16px; transition:background-color 0.3s ease, border-color 0.2s, box-shadow 0.2s; }
  #input-row:focus-within { border-color:rgba(255,60,120,0.4); box-shadow:0 0 30px rgba(255,60,120,0.1); }
  #user-input { flex:1; background:none; border:none; outline:none; color:var(--text); font-family:'DM Sans',sans-serif; font-size:0.94rem; font-weight:300; resize:none; line-height:1.5; max-height:160px; overflow-y:auto; }
  #user-input::placeholder { color:var(--muted); }

  #send-btn {
    width:38px; height:38px; border-radius:10px; border:none;
    background:linear-gradient(135deg,#ff3c78,#4f8eff,#3cffa0);
    background-size:300% 300%; animation:rgbLogo 4s ease infinite;
    color:#fff; cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    transition:transform 0.15s;
  }
  #send-btn:hover { transform:scale(1.07); }
  #send-btn:active { transform:scale(0.95); }
  #send-btn:disabled { opacity:0.4; cursor:not-allowed; transform:none; }

  .footer-hint { text-align:center; color:var(--muted); font-size:0.68rem; margin-top:8px; }

  #error-toast { position:fixed; bottom:90px; left:50%; transform:translateX(-50%) translateY(20px); background:#ff4466; color:#fff; border-radius:10px; padding:10px 18px; font-size:0.82rem; font-weight:500; opacity:0; pointer-events:none; transition:all 0.3s; z-index:99; max-width:340px; text-align:center; }
  #error-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">✡</div>
    <div class="title-wrap">
      <span class="title-cursive">Samuel's</span>
      <span class="title-bold">AI</span>
    </div>
    <span class="model-badge">Llama 3.3 · Groq</span>
    <button id="theme-toggle" class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle light/dark mode" aria-label="Toggle light and dark mode">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
  </header>
  <div class="rgb-line"></div>

  <div id="system-bar">
    <label>System Prompt (optional)</label>
    <textarea id="system-input" rows="1" placeholder="Give your AI a personality, role, or instructions…">You are a helpful, friendly AI assistant.</textarea>
  </div>

  <div id="messages">
    <div id="empty">
      <div class="big-logo">✡</div>
      <h2>What can I help with?</h2>
      <p>Ask anything — code, ideas, explanations, creative writing, or just a chat.</p>
      <div class="chips">
        <span class="chip" onclick="sendChip(this)">Explain quantum computing</span>
        <span class="chip" onclick="sendChip(this)">Write a short story</span>
        <span class="chip" onclick="sendChip(this)">Help me debug my code</span>
        <span class="chip" onclick="sendChip(this)">Give me a fun fact</span>
      </div>
    </div>
  </div>

  <div id="input-area">
    <div id="input-row">
      <textarea id="user-input" rows="1" placeholder="Send a message…"></textarea>
      <button id="send-btn" onclick="sendMessage()" title="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
    <p class="footer-hint">Samuel's AI · Enter to send · Shift+Enter for new line</p>
  </div>
</div>
<div id="error-toast"></div>

<script>
  const API_KEY = "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";
  const API_URL = "https://api.groq.com/openai/v1/chat/completions";
  const MODEL   = "llama-3.3-70b-versatile";
  const THEME_KEY = "samuels-ai-theme";

  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('user-input');
  const sendBtn    = document.getElementById('send-btn');
  const emptyEl    = document.getElementById('empty');
  const systemEl   = document.getElementById('system-input');

  let history  = [];
  let thinking = false;

  // Theme toggle
  function toggleTheme(){
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const next = isDark ? 'light' : 'dark';
    if (next === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    } else {
      document.documentElement.removeAttribute('data-theme');
    }
    try { localStorage.setItem(THEME_KEY, next); } catch(e) {}
  }

  function autoResize(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,160)+'px'; }
  inputEl.addEventListener('input',()=>autoResize(inputEl));
  inputEl.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();} });

  function sendChip(el){ inputEl.value=el.textContent; sendMessage(); }

  function escapeHtml(str){ return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'); }

  async function copyToClipboard(text, btn){
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
      } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      const label = btn.querySelector('span');
      const original = label.textContent;
      btn.classList.add('copied');
      label.textContent = 'Copied!';
      setTimeout(()=>{ btn.classList.remove('copied'); label.textContent = original; }, 1500);
    } catch(err) {
      showError('Could not copy — try selecting the text manually.');
    }
  }

  function appendMsg(role,text){
    if(emptyEl) emptyEl.style.display='none';

    const wrap = document.createElement('div');
    wrap.className = `msg ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role==='user' ? '👤' : '✡';

    const stack = document.createElement('div');
    stack.className = 'bubble-stack';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = escapeHtml(text);
    stack.appendChild(bubble);

    if (role === 'ai') {
      const copyBtn = document.createElement('button');
      copyBtn.type = 'button';
      copyBtn.className = 'copy-btn';
      copyBtn.setAttribute('aria-label','Copy message');
      copyBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg><span>Copy</span>';
      copyBtn.addEventListener('click', ()=>copyToClipboard(text, copyBtn));
      stack.appendChild(copyBtn);
    }

    wrap.appendChild(avatar);
    wrap.appendChild(stack);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return wrap;
  }

  function appendTyping(){
    if(emptyEl) emptyEl.style.display='none';
    const wrap=document.createElement('div');
    wrap.className='msg ai'; wrap.id='typing-indicator';
    wrap.innerHTML=`<div class="avatar">✡</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop=messagesEl.scrollHeight;
    return wrap;
  }

  function showError(msg){
    const toast=document.getElementById('error-toast');
    toast.textContent=msg; toast.classList.add('show');
    setTimeout(()=>toast.classList.remove('show'),5000);
  }

  async function sendMessage(){
    const text=inputEl.value.trim();
    if(!text||thinking) return;
    thinking=true; sendBtn.disabled=true;
    inputEl.value=''; autoResize(inputEl);
    appendMsg('user',text);
    history.push({role:'user',content:text});
    const typingEl=appendTyping();
    try {
      const systemPrompt=systemEl.value.trim();
      const messages=[...(systemPrompt?[{role:'system',content:systemPrompt}]:[]),...history];
      const res=await fetch(API_URL,{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':`Bearer ${API_KEY}`},
        body:JSON.stringify({model:MODEL,messages,max_tokens:1024})
      });
      const data=await res.json();
      typingEl.remove();
      if(data.error){ showError(`Error: ${data.error.message}`); history.pop(); }
      else {
        const reply=data.choices?.[0]?.message?.content||'(no response)';
        appendMsg('ai',reply);
        history.push({role:'assistant',content:reply});
      }
    } catch(err){
      typingEl.remove();
      showError('Network error — check your connection.');
      history.pop();
    }
    thinking=false; sendBtn.disabled=false; inputEl.focus();
  }
</script>
</body>
</html>
